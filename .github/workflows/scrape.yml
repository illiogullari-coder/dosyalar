name: Scrape Firmware & Update RSS
on:
  schedule:
    # Runs once a day (was every 2 hours / 12x per day). Single source: ximitime.com/hyperos/.
    # Reduced to stay within the GitHub Free plan's 2000 min/month Actions budget.
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Rebase/Pull işlemlerinin sorunsuz çalışması için tüm commit geçmişini çeker
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Migrate old feeds/ folder to feed/ (one-time, if present)
        run: |
          if [ -d "feeds" ] && [ ! -d "feed" ]; then
            git mv feeds feed
          fi
      - name: Run scraper
        run: |
          echo "Scraping: hyperos (ximitime.com)"
          node fetch_roms.js hyperos --depth 50 --out-dir ./feed
      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/
          git add -u feeds/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update firmware RSS feeds ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
